<!doctype html>
<html lang="en" __THEME__ __ACCENT__>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  __GENERATOR__
  <title>__TITLE__</title>
  __META__
  <link rel="icon" href="__ICON__">
  <link rel="stylesheet" href="assets/style.css">
  <script>try { const theme = localStorage.getItem("pypi-tracker-theme"); if (theme) document.documentElement.dataset.theme = theme; } catch { }</script>
  <script src="assets/app.js" defer></script>
</head>

<body data-config="__CONFIG__">
  <header class="site-header">
    <div class="identity">
      __IDENTITY__
      <div>
        <h1>__TITLE__</h1>
        __DESCRIPTION__
      </div>
    </div>
    <div class="header-actions">
      <a class="powered" href="https://github.com/yassi/pypi-tracker">Powered by pypi-tracker</a>
      <button id="theme-toggle" type="button"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <main id="main" aria-busy="true">
    <div id="controls" class="controls"></div>
    <p id="message" class="message" role="alert" hidden></p>
    <section id="detail" class="detail" hidden></section>
    <section id="overview" class="overview" aria-label="Summary"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Download trend</h2>
        <div id="chart-controls" class="controls"></div>
      </div>
      <div id="legend" class="legend"></div>
      <div id="chart" class="chart">
        <p class="state">Loading…</p>
      </div>
      <p id="chart-note" class="note"></p>
      <details class="data-table">
        <summary>View as table</summary>
        <div id="chart-table" class="table-scroll"></div>
      </details>
    </section>

    <section id="breakdown-panel" class="panel">
      <div class="panel-head">
        <h2>Package breakdown</h2>
      </div>
      <div id="breakdown" class="table-wide"></div>
      <p id="breakdown-note" class="note"></p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Reports</h2>
      </div>
      <p id="reports-note" class="note reports-note"></p>
      <dl id="reports" class="report-groups"></dl>
    </section>
  </main>

  <footer class="site-footer">
    Downloads from PyPIStats, excluding mirrors. This counts downloads, not unique installs or users.
  </footer>
  <div id="tooltip" class="tooltip" aria-hidden="true" hidden></div>
</body>

</html>
